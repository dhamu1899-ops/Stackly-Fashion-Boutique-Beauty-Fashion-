<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#ccc}iframe{border:0;display:block}</style>
</head><body>
<iframe name="f" id="f"></iframe>
<script>
var p=new URLSearchParams(location.search);

ifr.src=p.get('page')||'html/index.html';
</script>
</body></html>
